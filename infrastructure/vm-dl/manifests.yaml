apiVersion: v1
kind: Service
metadata:
  name: vm-dl-svc
  namespace: default
  annotations:
    konghq.com/read-timeout: "3600000"
    konghq.com/write-timeout: "3600000"
    konghq.com/connect-timeout: "60000"
spec:
  type: ExternalName
  externalName: 100.105.130.0
  ports:
    - name: http
      port: 8648
      protocol: TCP
      targetPort: 8648
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vm-dl-route
  namespace: default
  annotations:
    konghq.com/strip-path: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kong-main-gateway
      namespace: default
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dl
      backendRefs:
        - group: ""
          kind: Service
          name: vm-dl-svc
          port: 8648
          weight: 1
