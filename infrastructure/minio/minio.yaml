apiVersion: v1
kind: Namespace
metadata:
  name: minio
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: minio
type: Opaque
stringData:
  MINIO_ROOT_USER: litellm_admin
  MINIO_ROOT_PASSWORD: CHANGE_ME
  MINIO_IDENTITY_OPENID_CLIENT_SECRET: "ro4AzXu7jIm7H058Rd61aqmi84SwdUv3"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
  labels:
    app: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      nodeSelector:
        kubernetes.io/hostname: nuc # 🔒 调度固定在带 800GB NVMe 的 NUC 节点
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2024-08-29T01-40-52Z
          command:
            - /bin/sh
            - -ce
            - minio server /data --console-address ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_BROWSER_REDIRECT_URL
              value: "https://minio.jppwl.asia"
            # === Logto OpenID Connect (OIDC) SSO ===
            - name: MINIO_IDENTITY_OPENID_CONFIG_URL
              value: "https://sodaxw.logto.app/oidc/.well-known/openid-configuration"
            - name: MINIO_IDENTITY_OPENID_CLIENT_ID
              value: "inck8s2812o0gzfgzqvug"
            - name: MINIO_IDENTITY_OPENID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_IDENTITY_OPENID_CLIENT_SECRET
            - name: MINIO_IDENTITY_OPENID_SCOPES
              value: "openid,profile,email"
            - name: MINIO_IDENTITY_OPENID_REDIRECT_URI
              value: "https://minio.jppwl.asia/oauth_callback"
            - name: MINIO_IDENTITY_OPENID_DISPLAY_NAME
              value: "Logto / GitHub SSO"
            - name: MINIO_IDENTITY_OPENID_ROLE_POLICY
              value: "consoleAdmin"
          ports:
            - name: s3-api
              containerPort: 9000
            - name: web-console
              containerPort: 9001
          volumeMounts:
            - name: minio-storage
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: minio-storage
          hostPath:
            path: /data/litellm_payloads
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
  labels:
    app: minio
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: s3-api
      port: 9000
      targetPort: 9000
    - name: web-console
      port: 9001
      targetPort: 9001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-console-route
  namespace: minio
  labels:
    app: minio
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kong-main-gateway
      namespace: default
  hostnames:
    - "minio.jppwl.asia"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: minio
          port: 9001
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-payloads-route
  namespace: minio
  labels:
    app: minio
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kong-main-gateway
      namespace: default
  hostnames:
    - "payloads.jppwl.asia"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: minio
          port: 9000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
