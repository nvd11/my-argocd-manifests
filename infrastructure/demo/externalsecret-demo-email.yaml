# demo-email 的 SMTP 授权码（163 邮箱）
# 真相源：OCI Vault shared-secrets-vault 的 smtp-163-auth-code
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-email-secrets
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault-store
    kind: SecretStore
  target:
    name: demo-email-secrets
    creationPolicy: Owner
  data:
    - secretKey: SMTP_AUTH_CODE
      remoteRef:
        key: smtp-163-auth-code
