apiVersion: v1
kind: Service
metadata:
  name: cloudbeaver
  namespace: default
  annotations:
    konghq.com/plugins: oauth2-forward-auth
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8978
      targetPort: 8978
---
apiVersion: v1
kind: Endpoints
metadata:
  name: cloudbeaver
  namespace: default
subsets:
  - addresses:
      - ip: 100.95.20.57 # 🎯 StarFive 星光板 Tailscale 永久专网 IP
    ports:
      - port: 8978
        name: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cloudbeaver-route
  namespace: default
spec:
  parentRefs:
    - name: kong-main-gateway
      namespace: default
  hostnames:
    - "gw.jppwl.asia"
    - "gw-tx.jppwl.asia"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dbeaver
      backendRefs:
        - name: cloudbeaver
          port: 8978
