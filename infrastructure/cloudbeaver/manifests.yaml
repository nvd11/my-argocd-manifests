apiVersion: v1
kind: Service
metadata:
  name: cloudbeaver
  namespace: default
  annotations:
    konghq.com/plugins: oauth2-forward-auth
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8978
      targetPort: 8978
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: cloudbeaver-1
  namespace: default
  labels:
    kubernetes.io/service-name: cloudbeaver
addressType: IPv4
ports:
  - name: http
    appProtocol: http
    protocol: TCP
    port: 8978
endpoints:
  - addresses:
      - "100.95.20.57" # 🎯 StarFive 星光板 Tailscale 永久专网 IP
    conditions:
      ready: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cloudbeaver-route
  namespace: default
spec:
  parentRefs:
    - name: kong-main-gateway
      namespace: default
  hostnames:
    - "gw.jppwl.asia"
    - "gw-tx.jppwl.asia"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dbeaver
      backendRefs:
        - name: cloudbeaver
          port: 8978
