apiVersion: v1
kind: Namespace
metadata:
  name: flink
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: flink-sms-batch-etl
  namespace: flink
  labels:
    app: flink-sms-etl
spec:
  # 🎯 模式 B 纯批处理算完即焚：平时 0 进程、0 内存占用
  # 调度计划: 每 4 小时触发一次 (对应北京时间: 08:00, 12:00, 16:00, 20:00, 00:00, 04:00)
  schedule: "0 */4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: flink-sms-etl
        spec:
          nodeSelector:
            kubernetes.io/hostname: "nuc" # 🔒 核心调度约束：钉在 Intel NUC 节点上
          restartPolicy: OnFailure
          containers:
            - name: flink-batch-runner
              image: ghcr.io/nvd11/sms-flink-batch-etl:latest
              imagePullPolicy: Always
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "2000m"
                  memory: "2Gi"
