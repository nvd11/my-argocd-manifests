# CCTV 录像清理任务（cctv-prune）的凭据
#
# 真相源：OCI Vault `shared-secrets-vault` 里的 `cctv-pruner-alist-password`
# 由 ESO 每小时同步一次；Git 里只出现 secret 名字，绝不出现明文。
#
# 消费方：CronJob cctv-prune（见 argocd-apps/cctv-prune-app.yaml），以 envFrom 注入
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cctv-pruner-secrets
  namespace: cctv-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cctv-vault-store
    kind: SecretStore
  target:
    name: cctv-pruner-secrets
    creationPolicy: Owner
  data:
    - secretKey: ALIST_PASSWORD
      remoteRef:
        key: cctv-pruner-alist-password
