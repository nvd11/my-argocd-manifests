apiVersion: v1
kind: Namespace
metadata:
  name: trino
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-catalog-iceberg
  namespace: trino
data:
  iceberg.properties: |
    connector.name=iceberg
    iceberg.catalog.type=jdbc
    iceberg.jdbc-catalog.catalog-name=finance
    iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
    iceberg.jdbc-catalog.connection-url=jdbc:postgresql://brief-titan-32937.j77.aws-ap-southeast-1.cockroachlabs.cloud:26257/finance-db?sslmode=require
    iceberg.jdbc-catalog.connection-user=finance_user
    iceberg.jdbc-catalog.connection-password=qqMHLcNdtzrNB1hh
    iceberg.jdbc-catalog.default-warehouse-dir=s3://sms-flink-etl/iceberg/warehouse

    # Cloudflare R2 S3 兼容连接配置
    fs.s3.enabled=true
    s3.endpoint=https://8ac25a3a0ac482af1dbd6c65e118693e.r2.cloudflarestorage.com
    s3.path-style-access=true
    s3.region=auto
    s3.aws-access-key=35db4e6908dafcfefb36a4384fc87634
    s3.aws-secret-key=aea44e90549d73e4aaadf7de32d02448924fa923ee61eb341b10f789c6233478
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  namespace: trino
  labels:
    app: trino
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: trino
  template:
    metadata:
      labels:
        app: trino
    spec:
      nodeSelector:
        kubernetes.io/hostname: "nuc" # 🔒 核心调度约束：必须钉在 Intel NUC 节点上
      containers:
        - name: trino-coordinator
          image: trinodb/trino:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "1536Mi"
            limits:
              cpu: "2000m"
              memory: "3584Mi"
          readinessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 20
          volumeMounts:
            - name: iceberg-catalog
              mountPath: /etc/trino/catalog/iceberg.properties
              subPath: iceberg.properties
      volumes:
        - name: iceberg-catalog
          configMap:
            name: trino-catalog-iceberg
---
apiVersion: v1
kind: Service
metadata:
  name: trino
  namespace: trino
  labels:
    app: trino
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30880 # 🎯 局域网端口设为 30880 (K8s NodePort 标准有效区间 30000-32767，防与 Kodi 8080 冲突)
  selector:
    app: trino
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: trino-route
  namespace: trino
  labels:
    app: trino
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kong-main-gateway
      namespace: default
  hostnames:
    - "trino.jppwl.asia"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: trino
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
