apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-plugin-custom-auth
  namespace: kong-system
data:
  schema.lua: |
    local typedefs = require "kong.db.schema.typedefs"

    return {
      name = "custom-auth",
      fields = {
        { consumer = typedefs.no_consumer },
        { protocols = typedefs.protocols_http },
        { config = {
            type = "record",
            fields = {
              { username = { type = "string", required = true } },
              { password = { type = "string", required = true } },
            },
        }, },
      },
    }

  handler.lua: |
    local ngx = ngx
    local kong = kong

    local CustomAuth = {
      PRIORITY = 1000,
      VERSION = "1.1.0",
    }

    local AUTH_TOKEN = "dbgate_auth_token_hsbc2026"

    function CustomAuth:access(conf)
      -- 1. 优先检查浏览器是否已持有 Session Cookie (保障 AJAX 和 WebSocket 畅通)
      local cookie_header = kong.request.get_header("cookie")
      if cookie_header and cookie_header:find("dbgate_session=" .. AUTH_TOKEN) then
        return
      end

      -- 2. 检查 HTTP Basic Auth 请求头
      local auth_header = kong.request.get_header("authorization")
      if not auth_header or not auth_header:find("^Basic ") then
        kong.response.set_header("WWW-Authenticate", 'Basic realm="DbGate Secure Console"')
        return kong.response.exit(401, { message = "Unauthorized: 请提供有效的账号密码以访问 DbGate！" })
      end

      local token = auth_header:sub(7)
      local decoded = ngx.decode_base64(token)
      if not decoded then
        kong.response.set_header("WWW-Authenticate", 'Basic realm="DbGate Secure Console"')
        return kong.response.exit(401, { message = "Unauthorized: 认证 Token 解析失败！" })
      end

      local user, pass = decoded:match("([^:]+):(.*)")
      if user ~= conf.username or pass ~= conf.password then
        kong.log.warn("鉴权失败：客户端 IP [", kong.client.get_ip(), "] 尝试使用用户名 [", tostring(user), "] 登录失败！")
        kong.response.set_header("WWW-Authenticate", 'Basic realm="DbGate Secure Console"')
        return kong.response.exit(401, { message = "Unauthorized: 用户名或密码错误！" })
      end

      -- 3. 校验成功，下发 Session Cookie，确保单页应用后续所有的后台 POST/AJAX 自动放行
      kong.response.set_header("Set-Cookie", "dbgate_session=" .. AUTH_TOKEN .. "; Path=/; HttpOnly; SameSite=Lax")
      kong.log.info("鉴权成功：用户 [", user, "] 成功通过 DbGate 鉴权并签发 Session Cookie！")
    end

    return CustomAuth
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: dbgate-auth-plugin
  namespace: default
plugin: custom-auth
config:
  username: "jason"
  password: "Hsbc1234!"
