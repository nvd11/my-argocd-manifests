apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cctv-uploader
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nvd11/my-shared-helm-charts.git
    path: charts/generic-web-service-v2
    targetRevision: main
    helm:
      values: |
        replicaCount: 1
        containerPort: 8082

        nameOverride: cctv-uploader

        image:
          repository: ghcr.io/nvd11/cctv-uploader-service
          digest: sha256:9739df0709dfead5907c537cca365f1225dd84e3042728e6e953f09a21969d21
          pullPolicy: IfNotPresent

        envFrom:
          - configMapRef:
              name: cctv-uploader-config
          - secretRef:
              name: cctv-uploader-secrets

        volumeMounts:
          - name: cctv-buffer-vol
            mountPath: /mnt/buffer/cctv

        volumes:
          - name: cctv-buffer-vol
            hostPath:
              path: /home/gateman/cctv-buffer
              type: DirectoryOrCreate

        configMap:
          enabled: true
          name: cctv-uploader-config
          data:
            TZ: "Asia/Shanghai"
            CCTV_UPLOADER_BUFFER_DIR: "/mnt/buffer/cctv"
            CCTV_UPLOADER_ALIST_ENDPOINT: "http://10.0.1.227:5244/dav"
            CCTV_UPLOADER_ALIST_USERNAME: "gateman"
            CCTV_UPLOADER_REMOTE_BASE_DIR: "/Quark/CCTV_Records"
            CCTV_UPLOADER_LOCATION_NAME: "锦绣世家_客厅"
            CCTV_UPLOADER_MIN_FILE_AGE_SECONDS: "60"
            CCTV_UPLOADER_MAX_CONCURRENT_UPLOADS: "1"
            CCTV_UPLOADER_CLEANUP_POLICY: "DELETE"
            CCTV_UPLOADER_MIN_RETAINED_FILES: "10"
            CCTV_UPLOADER_SCAN_CRON_EXPRESSION: "0 */5 * * * ?"

        # 🔐 机密配置由 OCI Vault 经 External Secrets Operator 同步注入
        # Git 中只保留 OCI 侧的 secret 名称，绝不出现任何明文口令
        externalSecret:
          enabled: true
          refreshInterval: 1h
          secretStoreRef:
            name: cctv-vault-store
            kind: SecretStore
          target:
            name: cctv-uploader-secrets
            creationPolicy: Owner
          data:
            - secretKey: CCTV_UPLOADER_ALIST_PASSWORD
              remoteRef:
                key: cctv-uploader-alist-password

        livenessProbe:
          enabled: true
          path: /q/health/live
          port: 8082
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          enabled: true
          path: /q/health/ready
          port: 8082
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3

        service:
          type: ClusterIP
          port: 8082

        route:
          enabled: false

        extraRoutes:
          public-readonly:
            parentGateway: kong-main-gateway
            parentGatewayNamespace: default
            annotations:
              konghq.com/strip-path: "false"
            rules:
              - matches:
                  - path: /api/uploader/status
                  - path: /api/uploader/tasks
                  - path: /q/health

        nodeSelector:
          kubernetes.io/hostname: radxa-cubie-a7a

  destination:
    name: tencent-dp1-cluster
    namespace: cctv-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
