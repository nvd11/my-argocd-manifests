apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cctv-collector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nvd11/my-shared-helm-charts.git
    path: charts/generic-web-service-v2
    targetRevision: main
    helm:
      values: |
        replicaCount: 1
        containerPort: 8081

        nameOverride: cctv-collector

        image:
          repository: ghcr.io/nvd11/cctv-collector-service
          digest: sha256:30509ef4580da6cc6bb0466badd99fa46acd01530dc8851d0e337b50096d729b
          pullPolicy: IfNotPresent

        envFrom:
          - configMapRef:
              name: cctv-collector-config
          - secretRef:
              name: cctv-collector-secrets

        volumeMounts:
          - name: cctv-buffer-vol
            mountPath: /mnt/buffer/cctv

        volumes:
          - name: cctv-buffer-vol
            hostPath:
              path: /home/gateman/cctv-buffer
              type: DirectoryOrCreate

        configMap:
          enabled: true
          name: cctv-collector-config
          data:
            TZ: "Asia/Shanghai"
            CCTV_BUFFER_DIR: "/mnt/buffer/cctv"
            CCTV_SEGMENT_SECONDS: "900"
            CCTV_MIN_FREE_DISK_GB: "5"

        # 🔐 机密配置由 OCI Vault 经 External Secrets Operator 同步注入
        # Git 中只保留 OCI 侧的 secret 名称，绝不出现任何明文口令
        externalSecret:
          enabled: true
          refreshInterval: 1h
          secretStoreRef:
            name: cctv-vault-store
            kind: SecretStore
          target:
            name: cctv-collector-secrets
            creationPolicy: Owner
          data:
            - secretKey: CCTV_RTSP_URL
              remoteRef:
                key: cctv-rtsp-url

        livenessProbe:
          enabled: true
          path: /q/health/live
          port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          enabled: true
          path: /q/health/ready
          port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3

        service:
          type: ClusterIP
          port: 8081

        route:
          enabled: true
          parentGateway: kong-main-gateway
          parentGatewayNamespace: default
          path: /cctv
          pathType: PathPrefix
          annotations:
            konghq.com/strip-path: "true"

        nodeSelector:
          kubernetes.io/hostname: radxa-cubie-a7a

  destination:
    name: tencent-dp1-cluster
    namespace: cctv-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
