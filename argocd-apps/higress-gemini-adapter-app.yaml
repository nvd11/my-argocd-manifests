apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: higress-gemini-adapter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: higress-gemini-adapter
    app.kubernetes.io/part-of: my-higress-svc
spec:
  project: default
  source:
    repoURL: https://github.com/nvd11/my-shared-helm-charts.git
    path: charts/generic-web-service-v2
    targetRevision: main
    helm:
      values: |
        replicaCount: 1
        containerPort: 8080

        image:
          repository: ghcr.io/nvd11/my-higress-gemini-adapter
          digest: sha256:de13ec1fb610d7fdd4dc837ffb74c4c612e491eb94a6fb5a7a80eecdeb29820e
          pullPolicy: IfNotPresent

        env:
          - name: PORT
            value: "8080"
          - name: CONFIG_PATH
            value: "/etc/higress/config.yaml"
          - name: GEMINI_API_KEY
            valueFrom:
              secretKeyRef:
                name: higress-ai-secrets
                key: OPENAI_API_KEY_FREE_3
          - name: A6_API_KEY
            valueFrom:
              secretKeyRef:
                name: higress-ai-secrets
                key: A6_API_KEY

        volumeMounts:
          - name: higress-adapter-config-vol
            mountPath: /etc/higress

        volumes:
          - name: higress-adapter-config-vol
            configMap:
              name: higress-gemini-adapter-config

        configMap:
          enabled: true
          name: higress-gemini-adapter-config
          data:
            config.yaml: |
              # ==============================================================================
              # Higress AI Gateway / Adapter 声明式模型拓扑、渠道与费率配置 (对齐 LiteLLM 规范)
              # ==============================================================================
              # 支持运行时热加载与环境变量解析 (os.environ/KEY)
              # ==============================================================================

              model_list:
                # 🚀 Google Gemini 4 次世代先锋系列 (Google 官方 Standard Paid Tier 定价: $2.00 Input / $10.00 Output / $0.10 Cache Read)
                - model_name: "gemini-4-argon"
                  aliases:
                    - "gemini-4"
                    - "gemini-4-flash"
                  provider: "google-gemini"
                  protocol: "gemini-native"
                  upstream_url: "https://generativelanguage.googleapis.com"
                  upstream_model: "gemini-4-argon"
                  api_key: "os.environ/OPENAI_API_KEY_FREE_3"
                  fallback: "gemini-3.8-flash"
                  pricing:
                    prompt_per_1m: 2.000
                    completion_per_1m: 10.000
                    cache_read_per_1m: 0.100

                # 🚀 Google Gemini 4 搜索增强系列 (Google 官方 Standard Paid Tier 定价)
                - model_name: "gemini-4-argon-search"
                  aliases:
                    - "gemini-4:search"
                    - "gemini-4-search"
                  provider: "google-gemini"
                  protocol: "gemini-native"
                  upstream_url: "https://generativelanguage.googleapis.com"
                  upstream_model: "gemini-4-argon"
                  enable_search: true
                  api_key: "os.environ/OPENAI_API_KEY_FREE_3"
                  fallback: "gemini-3.8-flash-search"
                  pricing:
                    prompt_per_1m: 2.000
                    completion_per_1m: 10.000
                    cache_read_per_1m: 0.100

                # 🟢 Google Gemini 原生直连系列 (Google 官方 Standard Paid Tier 定价: $0.75 Input / $3.75 Output / $0.075 Cache Read)
                - model_name: "gemini-3.8-flash"
                  aliases:
                    - "gemini-3.8"
                    - "gemini-2.5-flash"
                  provider: "google-gemini"
                  protocol: "gemini-native"
                  upstream_url: "https://generativelanguage.googleapis.com"
                  api_key: "os.environ/OPENAI_API_KEY_FREE_3"
                  pricing:
                    prompt_per_1m: 0.750
                    completion_per_1m: 3.750
                    cache_read_per_1m: 0.075

                # 🟢 Google Gemini 原生搜索增强系列 (Google 官方 Standard Paid Tier 定价)
                - model_name: "gemini-3.8-flash-search"
                  aliases:
                    - "gemini-3.8-flash:search"
                  provider: "google-gemini"
                  protocol: "gemini-native"
                  upstream_url: "https://generativelanguage.googleapis.com"
                  upstream_model: "gemini-3.8-flash"
                  enable_search: true
                  api_key: "os.environ/OPENAI_API_KEY_FREE_3"
                  pricing:
                    prompt_per_1m: 0.750
                    completion_per_1m: 3.750
                    cache_read_per_1m: 0.075

                # 🛡️ A6 API 渠道: kimi-k3 (对齐原 LiteLLM A6 BBGT 极低商户价: ¥0.0766/1M Input, ¥0.3830/1M Output)
                - model_name: "kimi-k3"
                  aliases:
                    - "kimi"
                  provider: "a6api"
                  protocol: "openai"
                  upstream_url: "https://api.a6api.com/v1/chat/completions"
                  upstream_model: "kimi-k3"
                  api_key: "os.environ/A6_API_KEY"
                  fallback: "gpt-5.6-luna"
                  pricing:
                    prompt_per_1m: 0.010595
                    completion_per_1m: 0.052974
                    cache_read_per_1m: 0.010595

                # 🛡️ A6 API 渠道: glm-5.3 (对齐原 LiteLLM A6 BBGT-VIP 实测价: $0.0102/1M Input, $0.032057/1M Output)
                - model_name: "glm-5.3"
                  aliases:
                    - "glm"
                  provider: "a6api"
                  protocol: "openai"
                  upstream_url: "https://api.a6api.com/v1/chat/completions"
                  upstream_model: "glm-5.3"
                  api_key: "os.environ/A6_API_KEY"
                  fallback: "gpt-5.6-luna"
                  pricing:
                    prompt_per_1m: 0.0102
                    completion_per_1m: 0.032057
                    cache_read_per_1m: 0.0102

                # 🛡️ A6 API 渠道: gpt-5.6-luna (对齐原 LiteLLM A6 实测价: $0.0096/1M)
                - model_name: "gpt-5.6-luna"
                  aliases:
                    - "luna"
                    - "gpt-5.6-luna-a6"
                  provider: "a6api"
                  protocol: "openai"
                  upstream_url: "https://api.a6api.com/v1/chat/completions"
                  upstream_model: "gpt-5.6-luna"
                  api_key: "os.environ/A6_API_KEY"
                  pricing:
                    prompt_per_1m: 0.0096
                    completion_per_1m: 0.0096
                    cache_read_per_1m: 0.0096
        livenessProbe:
          enabled: true
          path: /health
          port: 8080
          initialDelaySeconds: 5
          periodSeconds: 15
          failureThreshold: 3

        readinessProbe:
          enabled: true
          path: /health
          port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3

        service:
          type: ClusterIP
          port: 8080

        nodeSelector:
          kubernetes.io/hostname: free-arm-vm

  destination:
    name: tencent-dp1-cluster
    namespace: higress-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
