apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: higress-gemini-adapter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: higress-gemini-adapter
    app.kubernetes.io/part-of: my-higress-svc
spec:
  project: default
  source:
    repoURL: https://github.com/nvd11/my-shared-helm-charts.git
    path: charts/generic-web-service-v2
    targetRevision: main
    helm:
      values: |
        replicaCount: 1
        containerPort: 8080

        image:
          repository: ghcr.io/nvd11/my-higress-gemini-adapter
          digest: sha256:7afe96ed70e5c433c75303ff4495434574b612e625606320652a02c51c3c56b8
          pullPolicy: IfNotPresent

        env:
          - name: PORT
            value: "8080"
          - name: GEMINI_API_KEY
            valueFrom:
              secretKeyRef:
                name: higress-ai-secrets
                key: OPENAI_API_KEY_FREE_3
          - name: A6_API_KEY
            valueFrom:
              secretKeyRef:
                name: higress-ai-secrets
                key: A6_API_KEY

        livenessProbe:
          enabled: true
          path: /health
          port: 8080
          initialDelaySeconds: 5
          periodSeconds: 15
          failureThreshold: 3

        readinessProbe:
          enabled: true
          path: /health
          port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3

        service:
          type: ClusterIP
          port: 8080

        nodeSelector:
          kubernetes.io/hostname: free-arm-vm

  destination:
    name: tencent-dp1-cluster
    namespace: higress-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
