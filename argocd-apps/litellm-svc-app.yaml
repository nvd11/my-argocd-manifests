apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm-svc
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nvd11/my-shared-helm-charts.git
    path: charts/generic-web-service-v2
    targetRevision: main
    helm:
      values: |
        replicaCount: 1
        containerPort: 4000

        image:
          repository: ghcr.io/nvd11/my-litellm-svc
          digest: sha256:aa9244b40f0005e063323a01e22514650db7b3899eb6d14f139546b877dc0988
          pullPolicy: IfNotPresent

        env:
          - name: CONTROL_PLANE_DB_PROVIDER
            value: "neon-postgresql"

        envFrom:
          - configMapRef:
              name: litellm-config
          - secretRef:
              name: litellm-secrets

        configMap:
          enabled: true
          name: litellm-config
          data:
            NO_PROXY: "localhost,127.0.0.1,10.0.0.0/8,.svc,.cluster.local"
            REDIS_HOST: "redis.redis.svc.cluster.local"
            REDIS_PORT: "6379"
            MYSQL_HOST: "161.118.240.218"
            MYSQL_PORT: "3306"
            MYSQL_USER: "litellm_user"
            MYSQL_DB: "litellm_db"
            DEFAULT_USD_TO_CNY_RATE: "7.23"
            LITELLM_PORT: "4000"
            PAYLOAD_BACKEND: "victorialogs"
            VICTORIALOGS_URL: "http://100.95.20.57:9428"

        externalSecret:
          enabled: true
          refreshInterval: 1h
          secretStoreRef:
            name: oci-litellm-vault-store
            kind: SecretStore
          target:
            name: litellm-secrets
            creationPolicy: Owner
          data:
            - secretKey: OPENAI_API_KEY_FREE_1
              remoteRef:
                key: litellm-openai-api-key-free-1
            - secretKey: OPENAI_API_KEY_FREE_2
              remoteRef:
                key: litellm-openai-api-key-free-2
            - secretKey: OPENAI_API_KEY_FREE_3
              remoteRef:
                key: litellm-openai-api-key-free-3
            - secretKey: OPENAI_API_KEY_PRO_PLAN
              remoteRef:
                key: litellm-openai-api-key-pro-plan
            - secretKey: A6_API_KEY
              remoteRef:
                key: litellm-a6-api-key
            - secretKey: META_API_KEY
              remoteRef:
                key: litellm-meta-api-key
            - secretKey: LITELLM_MASTER_KEY
              remoteRef:
                key: litellm-master-key
            - secretKey: REDIS_PASSWORD
              remoteRef:
                key: litellm-redis-password
            - secretKey: MYSQL_PASSWORD
              remoteRef:
                key: litellm-mysql-password
            - secretKey: DATABASE_URL
              remoteRef:
                key: litellm-database-url

        livenessProbe:
          enabled: true
          path: /health/liveliness
          port: 4000
          initialDelaySeconds: 45
          periodSeconds: 15
          failureThreshold: 5
        readinessProbe:
          enabled: true
          path: /health/readiness
          port: 4000
          initialDelaySeconds: 45
          periodSeconds: 15
          failureThreshold: 5

        service:
          type: ClusterIP
          port: 4000
          annotations:
            konghq.com/read-timeout: "180000"
            konghq.com/write-timeout: "180000"
            konghq.com/connect-timeout: "60000"

        route:
          enabled: true
          parentGateway: kong-main-gateway
          path: /litellm
          pathType: PathPrefix
          annotations:
            konghq.com/strip-path: "true"

        extraRoutes:
          ui-route:
            parentGateway: kong-main-gateway
            parentGatewayNamespace: default
            annotations:
              konghq.com/plugins: oauth2-forward-auth
            rules:
              - matches:
                  - path: /dashboard
                  - path: /api/v1
              - matches:
                  - path: /ui
                  - path: /litellm-asset-prefix
                  - path: /_next
                  - path: /fallback
                  - path: /swagger
                  - path: /get_favicon
                  - path: /get_logo_url
                  - path: /favicon.ico
              - matches:
                  - path: /login
                  - path: /v2
                  - path: /v3
                  - path: /auth
                  - path: /sso
                  - path: /onboarding
                  - path: /invitation
              - matches:
                  - path: /key
                  - path: /user
                  - path: /team
                  - path: /customer
                  - path: /organization
                  - path: /project
                  - path: /spend
                  - path: /budget
              - matches:
                  - path: /models
                  - path: /model
                  - path: /model_group
                  - path: /model_hub
                  - path: /routes
                  - path: /global
                  - path: /config
                  - path: /settings
              - matches:
                  - path: /health
                  - path: /cache
                  - path: /alerting
                  - path: /audit

        nodeSelector:
          kubernetes.io/hostname: free-arm-vm

  destination:
    name: tencent-dp1-cluster
    namespace: llm-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jsonPointers:
        - /spec/parentRefs/0/group
        - /spec/parentRefs/0/kind
        - /status
