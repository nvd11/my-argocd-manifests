apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm-svc
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nvd11/my-shared-helm-charts.git
    path: charts/generic-web-service-v2
    targetRevision: main
    helm:
      values: |
        replicaCount: 1
        containerPort: 4000

        image:
          repository: ghcr.io/nvd11/my-litellm-svc
          digest: sha256:60ca0cee8fb09c53d836359fba77c6411249d767c89f9fc3251e068be8247d7b
          pullPolicy: IfNotPresent

        command:
          - litellm
        args:
          - --config
          - /app/config/config.yaml
          - --port
          - "4000"

        envFrom:
          - configMapRef:
              name: litellm-config
          - secretRef:
              name: litellm-secrets

        configMap:
          enabled: true
          name: litellm-config
          data:
            NO_PROXY: "localhost,127.0.0.1,10.0.0.0/8,.svc,.cluster.local"
            config.yaml: |
              model_list:
                - model_name: gemini-3.6-flash-freelayer
                  litellm_params:
                    model: gemini/gemini-3.6-flash
                    api_key: os.environ/OPENAI_API_KEY_FREE_1
                    rpm: 15
                - model_name: gemini-3.6-flash-freelayer
                  litellm_params:
                    model: gemini/gemini-3.6-flash
                    api_key: os.environ/OPENAI_API_KEY_FREE_2
                    rpm: 15
                - model_name: gemini-3.7-flash-freelayer
                  litellm_params:
                    model: gemini/gemini-3.7-flash
                    api_key: os.environ/OPENAI_API_KEY_FREE_1
                    rpm: 15
                - model_name: gemini-3.7-flash-freelayer
                  litellm_params:
                    model: gemini/gemini-3.7-flash
                    api_key: os.environ/OPENAI_API_KEY_FREE_2
                    rpm: 15

              router_settings:
                routing_strategy: "least-busy"
                num_retries: 3
                retry_after: 5
                cooldown_time: 30
                fallbacks:
                  - gemini-3.6-flash-freelayer: ["gemini-3.7-flash-freelayer"]
                  - gemini-3.7-flash-freelayer: ["gemini-3.6-flash-freelayer"]

              litellm_settings:
                cache: true
                cache_params:
                  type: redis
                  host: redis.redis.svc.cluster.local
                  port: 6379
                  password: os.environ/REDIS_PASSWORD
                  supported_call_types: [chat_completion]
                  ttl: 3600

        externalSecret:
          enabled: true
          refreshInterval: 1h
          secretStoreRef:
            name: oci-litellm-vault-store
            kind: SecretStore
          target:
            name: litellm-secrets
            creationPolicy: Owner
          data:
            - secretKey: OPENAI_API_KEY_FREE_1
              remoteRef:
                key: litellm-openai-api-key-free-1
            - secretKey: OPENAI_API_KEY_FREE_2
              remoteRef:
                key: litellm-openai-api-key-free-2
            - secretKey: LITELLM_MASTER_KEY
              remoteRef:
                key: litellm-master-key
            - secretKey: REDIS_PASSWORD
              remoteRef:
                key: litellm-redis-password

        volumeMounts:
          - name: config
            mountPath: /app/config
            readOnly: true
        volumes:
          - name: config
            configMap:
              name: litellm-config
              items:
                - key: config.yaml
                  path: config.yaml

        livenessProbe:
          enabled: true
          path: /health/liveliness
          port: 4000
          initialDelaySeconds: 45
          periodSeconds: 15
          failureThreshold: 5
        readinessProbe:
          enabled: true
          path: /health/readiness
          port: 4000
          initialDelaySeconds: 45
          periodSeconds: 15
          failureThreshold: 5

        service:
          type: ClusterIP
          port: 4000
          annotations:
            konghq.com/read-timeout: "180000"
            konghq.com/write-timeout: "180000"
            konghq.com/connect-timeout: "60000"

        route:
          enabled: true
          parentGateway: kong-main-gateway
          path: /litellm
          pathType: PathPrefix
          annotations:
            konghq.com/strip-path: "true"

        nodeSelector:
          kubernetes.io/hostname: free-arm-vm

  destination:
    name: tencent-dp1-cluster
    namespace: llm-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
