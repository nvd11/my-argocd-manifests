apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm-svc
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nvd11/my-shared-helm-charts.git
    path: charts/generic-web-service-v2
    targetRevision: main
    helm:
      values: |
        replicaCount: 1
        containerPort: 4000

        image:
          repository: ghcr.io/nvd11/my-litellm-svc
          digest: sha256:53af78db54bfec9eb8779b3c13fd9a250ee3d82fa8a9a74f946e51542439509d
          pullPolicy: IfNotPresent

        command:
          - litellm
        args:
          - --config
          - /app/config/config.yaml
          - --port
          - "4000"

        envFrom:
          - configMapRef:
              name: litellm-config
          - secretRef:
              name: litellm-secrets

        configMap:
          enabled: true
          name: litellm-config
          data:
            NO_PROXY: "localhost,127.0.0.1,10.0.0.0/8,.svc,.cluster.local"
            config.yaml: |
              # ==============================================================================
              # LiteLLM Proxy Model & Multi-Tier Routing Configuration
              # ==============================================================================
              # Key 角色与梯队定义说明：
              # - OPENAI_API_KEY_FREE_1  : 主力老号 1 (主人) - Tier 1 日常轮换
              # - OPENAI_API_KEY_FREE_2  : 主力老号 2 (师母) - Tier 1 日常轮换
              # - OPENAI_API_KEY_PRO_PLAN: 主力 Google AI Pro 旗舰号 - Tier 2 一级应急升舱
              # - OPENAI_API_KEY_FREE_3  : 终极应急保底号 - Tier 3 终极避震保底
              # ==============================================================================
              model_list:
                # === 🟢 梯队一：主力日常轮换组 (Key 1 & Key 2 平摊 50/50 负载) ===
                - model_name: gemini-3.7-flash
                  litellm_params:
                    model: gemini/gemini-3.6-flash
                    api_key: os.environ/OPENAI_API_KEY_FREE_1
                    rpm: 15
                - model_name: gemini-3.7-flash
                  litellm_params:
                    model: gemini/gemini-3.6-flash
                    api_key: os.environ/OPENAI_API_KEY_FREE_2
                    rpm: 15

                # === 🟡 梯队二：一级应急升舱组 (Pro Plan 专属，主力 429 时触发) ===
                - model_name: gemini-3.7-pro-plan
                  litellm_params:
                    model: gemini/gemini-3.6-flash
                    api_key: os.environ/OPENAI_API_KEY_PRO_PLAN
                    rpm: 15

                # === 🛡️ 梯队三：终极应急保底组 (Key 3 专属，平时 0 流量) ===
                - model_name: gemini-3.7-backup
                  litellm_params:
                    model: gemini/gemini-3.6-flash
                    api_key: os.environ/OPENAI_API_KEY_FREE_3
                    rpm: 15

              router_settings:
                routing_strategy: "least-busy" # 负载均衡：优先选择当前空闲/负载最小的 Key 派发请求

                # 🎯 充沛重试预算：初始尝试失败后，最多跨 Key / 跨梯队重试 5 次（总共 6 次尝试机会），
                # 确保能 100% 完整覆盖【主力 Key 1/2 -> Pro Plan 升舱 -> Key 3 终极保底】的所有梯队。
                num_retries: 5

                # 🎯 极速熔断触发器：单个 Key 只要连续失败 1 次（如遭遇 429 限流或 5xx 错误），立即判定生病并关禁闭，
                # 绝不在同一个已报错的 Key 上浪费重试次数，0.01 秒内迅速切换到下一个健康 Key。
                allowed_fails: 1

                # 🎯 满血禁闭冷却期：故障 Key 在小黑屋中隔离 60 秒（单位：秒）。
                # 设为 60 秒正好完整错开 Google 免费层的 1 分钟 (15 RPM) 滑动窗口惩罚期，确保解禁归队时 100% 满血复活。
                cooldown_time: 60

                fallbacks:
                  # 🎯 梯队级联降级链：主力组 (FREE_1 + FREE_2) -> Pro Plan 升舱 -> Key 3 终极保底
                  - gemini-3.7-flash: ["gemini-3.7-pro-plan", "gemini-3.7-backup"]

              litellm_settings:
                cache: true
                cache_params:
                  type: redis
                  host: redis.redis.svc.cluster.local
                  port: 6379
                  password: os.environ/REDIS_PASSWORD
                  supported_call_types: [chat_completion]
                  ttl: 3600

        externalSecret:
          enabled: true
          refreshInterval: 1h
          secretStoreRef:
            name: oci-litellm-vault-store
            kind: SecretStore
          target:
            name: litellm-secrets
            creationPolicy: Owner
          data:
            - secretKey: OPENAI_API_KEY_FREE_1
              remoteRef:
                key: litellm-openai-api-key-free-1
            - secretKey: OPENAI_API_KEY_FREE_2
              remoteRef:
                key: litellm-openai-api-key-free-2
            - secretKey: OPENAI_API_KEY_FREE_3
              remoteRef:
                key: litellm-openai-api-key-free-3
            - secretKey: OPENAI_API_KEY_PRO_PLAN
              remoteRef:
                key: litellm-openai-api-key-pro-plan
            - secretKey: LITELLM_MASTER_KEY
              remoteRef:
                key: litellm-master-key
            - secretKey: REDIS_PASSWORD
              remoteRef:
                key: litellm-redis-password

        volumeMounts:
          - name: config
            mountPath: /app/config
            readOnly: true
        volumes:
          - name: config
            configMap:
              name: litellm-config
              items:
                - key: config.yaml
                  path: config.yaml

        livenessProbe:
          enabled: true
          path: /health/liveliness
          port: 4000
          initialDelaySeconds: 45
          periodSeconds: 15
          failureThreshold: 5
        readinessProbe:
          enabled: true
          path: /health/readiness
          port: 4000
          initialDelaySeconds: 45
          periodSeconds: 15
          failureThreshold: 5

        service:
          type: ClusterIP
          port: 4000
          annotations:
            konghq.com/read-timeout: "180000"
            konghq.com/write-timeout: "180000"
            konghq.com/connect-timeout: "60000"

        route:
          enabled: true
          parentGateway: kong-main-gateway
          path: /litellm
          pathType: PathPrefix
          annotations:
            konghq.com/strip-path: "true"

        nodeSelector:
          kubernetes.io/hostname: free-arm-vm

  destination:
    name: tencent-dp1-cluster
    namespace: llm-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
