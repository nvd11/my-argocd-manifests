apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: higress-svc
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: higress-ai-gateway
    app.kubernetes.io/part-of: my-higress-svc
spec:
  project: default
  sources:
    # --------------------------------------------------------------------------
    # 1. 官方 Higress 核心 Helm Chart (纯净核心：Controller、Envoy Gateway 与核心 CRD)
    # --------------------------------------------------------------------------
    - chart: higress-core
      repoURL: https://higress.io/helm-charts
      targetRevision: 2.2.5
      helm:
        valueFiles:
          - $values/values.yaml

    # --------------------------------------------------------------------------
    # 2. 挂载 my-higress-svc 仓库根目录 (自动同步 ai-proxy, hermes-passthrough, secrets)
    # --------------------------------------------------------------------------
    - repoURL: https://github.com/nvd11/my-higress-svc.git
      targetRevision: main
      ref: values
      path: .

  destination:
    name: tencent-dp1-cluster
    namespace: higress-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true

  ignoreDifferences:
    # 🎯 忽略由 ExternalSecrets Operator 动态从 OCI Vault 拉取并填充的真实密钥数据
    - group: ""
      kind: Secret
      name: higress-ai-secrets
      jsonPointers:
        - /data
    # 🎯 忽略 HTTPRoute 由网关动态写回的路由 status 状态
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jsonPointers:
        - /status
    # 🎯 忽略 Ingress 中由集群动态注入的真实上游 API Key 授权头
    - group: networking.k8s.io
      kind: Ingress
      name: higress-ai-ingress
      jsonPointers:
        - /metadata/annotations/higress.io~1request-header-control-update
