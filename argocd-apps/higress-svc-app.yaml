apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: higress-svc
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: higress-ai-gateway
    app.kubernetes.io/part-of: my-higress-svc
spec:
  project: default
  sources:
    # --------------------------------------------------------------------------
    # 1. 官方 Higress 核心 Helm Chart (纯净核心：Controller、Envoy Gateway 与核心 CRD)
    # --------------------------------------------------------------------------
    - chart: higress-core
      repoURL: https://higress.io/helm-charts
      targetRevision: 2.2.5
      helm:
        valueFiles:
          - $values/values.yaml

    # --------------------------------------------------------------------------
    # 2. 挂载 my-higress-svc 仓库根目录 (自动同步 ai-proxy, hermes-passthrough, secrets)
    # --------------------------------------------------------------------------
    - repoURL: https://github.com/nvd11/my-higress-svc.git
      targetRevision: main
      ref: values
      path: .

  destination:
    name: tencent-dp1-cluster
    namespace: higress-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true

  ignoreDifferences:
    # 🎯 忽略由 ExternalSecrets Operator 动态从 OCI Vault 拉取并填充的真实密钥数据
    - group: ""
      kind: Secret
      name: higress-ai-secrets
      jsonPointers:
        - /data
    # 🎯 忽略 HTTPRoute 由网关动态写回的路由 status 状态
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jsonPointers:
        - /status
    # 🎯 忽略由 higress-provider-key-sync Job 回填的 WasmPlugin 上游真实密钥。
    #    该子映射**完全不进 Git**: config.yaml 每新增一个带 api_key 的 provider,
    #    pricinggen 会在对应 Ingress 上打 higress.io/upstream-key-env 标注,
    #    Job 据此从 Secret 取值并 merge-patch 进 WasmPlugin.defaultConfig.upstream_keys
    #    (kubectl patch 写入的字段不在 ArgoCD last-applied 里, 后续 sync 不会清掉)。
    - group: extensions.higress.io
      kind: WasmPlugin
      name: ai-gatekeeper
      jsonPointers:
        - /spec/defaultConfig/upstream_keys
