apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: astra-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nvd11/my-shared-helm-charts.git
    path: charts/generic-web-service-v2
    targetRevision: main
    helm:
      values: |
        replicaCount: 1
        containerPort: 8000

        image:
          repository: ghcr.io/nvd11/astra-backend
          digest: sha256:789f784dfcdb84aabaed386b6d122d640f8d5255b907bcd5630d6f9728c48a47
          pullPolicy: IfNotPresent

        envFrom:
          - configMapRef:
              name: astra-backend-config

        configMap:
          enabled: true
          name: astra-backend-config
          data:
            APP_NAME: "Astra"
            APP_VERSION: "1.0.0"
            APP_ENVIRONMENT: "prod"
            APP_DEBUG: "false"
            APP_HOST: "0.0.0.0"
            APP_PORT: "8000"
            APP_ROOT_PATH: "/astra/api"
            APP_WORKERS: "1"
            APP_LOG_LEVEL: "INFO"
            APP_DATABASE_URL: "mysql+asyncmy://admin:Hsbc1234!@161.118.240.218:3306/astra"
            APP_REDIS_URL: "redis://:hsbc1234@redis.redis.svc.cluster.local:6379/0"
            APP_LITELLM_BASE_URL: "https://gw.jppwl.asia/litellm/v1"
            APP_LITELLM_API_KEY: "sk-9zKBqtZ_kc6s24kVQPN9Lw"
            APP_DEFAULT_MODEL: "gemini-3.8-flash"
            APP_AUTH_ENABLED: "false"
            APP_AUTH_MODE: "cloudflare"
            APP_CLOUDFLARE_TEAM_NAME: "jppwl"
            APP_CLOUDFLARE_AUDIENCE: "astra-audience-tag"

        livenessProbe:
          enabled: true
          path: /live
          port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3

        readinessProbe:
          enabled: true
          path: /ready
          port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3

        service:
          type: ClusterIP
          port: 8000
          annotations:
            konghq.com/read-timeout: "180000"
            konghq.com/write-timeout: "180000"
            konghq.com/connect-timeout: "60000"

        route:
          enabled: true
          parentGateway: kong-main-gateway
          path: /astra/api
          pathType: PathPrefix
          annotations:
            konghq.com/strip-path: "true"

        nodeSelector:
          kubernetes.io/hostname: free-arm-vm

  destination:
    name: tencent-dp1-cluster
    namespace: llm-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
