apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scheduler-frontend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: scheduler-frontend
    app.kubernetes.io/part-of: aws-scheduler-dashboard
spec:
  project: default
  source:
    repoURL: https://github.com/nvd11/my-shared-helm-charts.git
    path: charts/generic-web-service-v2
    targetRevision: main
    helm:
      values: |
        replicaCount: 1
        containerPort: 80

        image:
          repository: ghcr.io/nvd11/scheduler-frontend
          digest: sha256:3d105f865ee84862a00c78a70c23f19c1102dcf161e85b96b264aaf17f30fda0
          pullPolicy: IfNotPresent

        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi

        livenessProbe:
          enabled: true
          path: /health
          port: http
          initialDelaySeconds: 5
          periodSeconds: 20
          failureThreshold: 3

        readinessProbe:
          enabled: true
          path: /health
          port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3

        service:
          type: ClusterIP
          port: 80
          annotations:
            konghq.com/plugins: oauth2-forward-auth

        route:
          enabled: true
          parentGateway: kong-main-gateway
          parentGatewayNamespace: default
          path: /scheduler
          pathType: PathPrefix
          annotations:
            konghq.com/plugins: oauth2-forward-auth

        nodeSelector:
          kubernetes.io/hostname: radxa-cubie-a7a

  destination:
    name: tencent-dp1-cluster
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jsonPointers:
        - /status
