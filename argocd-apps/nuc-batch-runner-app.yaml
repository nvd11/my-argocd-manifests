apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nuc-batch-runner # 🎯 通用 NUC 批处理计算发射架 (彻底消灭业务特定字眼)
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4" # 🎯 批处理算力层
spec:
  project: default
  source:
    repoURL: 'https://github.com/nvd11/my-shared-helm-charts.git'
    path: charts/generic-batch-job # 🎯 引用纯粹中立的通用批处理模具
    targetRevision: HEAD
    helm:
      values: |
        fullnameOverride: nuc-batch-runner

        # 🎯 核心铁律：本地时钟彻底挂起！100% 由外部指令/云端吹哨唤醒，杜绝双重调度冲突
        suspend: true
        schedule: "0 0 31 2 *" # 纯静态模版占位符 (2月31日永不自动触发)

        image:
          repository: ghcr.io/nvd11/sms-flink-batch-etl # 默认保底基线镜像 (随时可通过参数覆盖换成视频清理等其他业务镜像)
          tag: latest
          pullPolicy: Always

        nodeSelector:
          kubernetes.io/hostname: "nuc" # 🔒 严格锁定 Intel NUC 算力节点

        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
  destination:
    name: 'tencent-dp1-cluster'
    namespace: batch-jobs # 🎯 独立的通用批处理命名空间
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
