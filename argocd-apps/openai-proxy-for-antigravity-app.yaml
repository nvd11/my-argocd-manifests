apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openai-proxy-for-antigravity
  namespace: argocd
  labels:
    app.kubernetes.io/name: openai-proxy-for-antigravity
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  project: default
  source:
    repoURL: https://github.com/nvd11/my-shared-helm-charts.git
    path: charts/generic-web-service-v2
    targetRevision: main
    helm:
      values: |
        replicaCount: 1
        containerPort: 3000

        image:
          repository: ghcr.io/nvd11/openai-proxy-for-antigravity
          digest: sha256:27b4a1a3c03494edf764ab712ae066c9cf757c1719f5e90756e2b211230407b4
          pullPolicy: IfNotPresent

        nodeSelector:
          kubernetes.io/hostname: free-arm-vm

        envFrom:
          - configMapRef:
              name: openai-proxy-config
          - secretRef:
              name: litellm-secrets

        configMap:
          enabled: true
          name: openai-proxy-config
          data:
            PORT: "3000"
            CONFIG_DIR: "/etc/antigravity-proxy"
            ROTATION_STRATEGY: "round-robin"
            LOG_LEVEL: "info"
            A6_UPSTREAM_URL: "https://api.a6api.com/v1/chat/completions"

        volumes:
          - name: antigravity-creds
            secret:
              secretName: antigravity-proxy-credentials
              items:
                - key: antigravity-accounts.json
                  path: antigravity-accounts.json

        volumeMounts:
          - name: antigravity-creds
            mountPath: /etc/antigravity-proxy
            readOnly: true

        livenessProbe:
          enabled: true
          path: /health
          port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3

        readinessProbe:
          enabled: true
          path: /health
          port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3

        service:
          type: ClusterIP
          port: 3000

        route:
          enabled: false

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1024Mi

  destination:
    name: tencent-dp1-cluster
    namespace: llm-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
