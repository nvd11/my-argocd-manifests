apiVersion: v1
kind: Namespace
metadata:
  name: finance
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sms-flink-lakehouse-job
  namespace: finance
  labels:
    app: sms-flink-lakehouse
spec:
  # 🎯 核心铁律：本地时钟彻底挂起！100% 由云端 AWS EventBridge 精准调度吹哨，杜绝双重调度冲突
  suspend: true
  schedule: "0 0 31 2 *" # 纯静态模版占位符（2月31日永不自动触发）
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: sms-flink-lakehouse
        spec:
          nodeSelector:
            kubernetes.io/hostname: "nuc" # 🔒 严格锁定 Intel NUC 算力节点
          restartPolicy: OnFailure
          containers:
            - name: flink-batch-runner
              image: ghcr.io/nvd11/sms-flink-batch-etl:latest
              imagePullPolicy: Always
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "2000m"
                  memory: "2Gi"
