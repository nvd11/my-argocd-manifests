# ============================================================
# CD Configuration Update (镜像 Tag 更新机器人)
#
# 【这个 workflow 是干什么的】
#   它只做一件事：把 ArgoCD 清单里某个应用的镜像 tag 改掉，然后 push 回 Git。
#   部署动作由 ArgoCD 完成（ArgoCD 每 3 分钟轮询 Git，发现 tag 变化后自动部署）。
#
# 【四个关键问题】
#   1. 镜像是 Docker image 吗？
#      -> 是。应用代码构建出来的 Docker 镜像。
#   2. 为什么要改 tag？
#      -> 因为 ArgoCD 部署时按清单里写的 tag 拉镜像。不改 tag，它永远用旧版本。
#   3. 什么时候触发改 tag？
#      -> 应用仓库 CI 构建完新镜像后，通过 repository_dispatch API 远程唤醒本 workflow。
#   4. 改成什么 tag？
#      -> 新构建的镜像 tag（通常是 git commit 的 SHA）。
#
# 【完整链路】
#   应用仓库 CI (构建镜像)
#     -> POST /repos/nvd11/my-argocd-manifests/dispatches (携带 svc_name + image_tag)
#     -> 本 workflow 被唤醒 (repository_dispatch)
#     -> sed 改 argocd-apps/<svc>-app.yaml 里的 tag
#     -> commit + push 回 Git
#     -> ArgoCD 轮询发现 tag 变化 -> 拉新镜像 -> 自动部署
#
# 【为什么不用 push 触发？】
#   push 触发器只监听本仓库的 push，但镜像 tag 更新需求来自【其他仓库】的 CI。
#   repository_dispatch 是跨仓库的"打电话"机制：
#   应用 CI 构建完，打一通电话给本仓库"该更新 tag 了"。
#
# 【验证】
#   本 workflow 的运行记录全部是 repository_dispatch 事件触发的，无一例外。
#   (2026-06-27 的 8 次运行全部 success)
#
# 【本 workflow 接受的参数】
#   触发事件：repository_dispatch
#   事件类型：update-image-tag
#
#   请求体中的 client_payload 必须包含：
#
#   {
#     "event_type": "update-image-tag",
#     "client_payload": {
#       "svc_name": "litellm-svc",
#       "image_tag": "<git-commit-sha>"
#     }
#   }
#
#   参数说明：
#   - svc_name：服务名，用于拼接 ArgoCD Application 清单文件名。
#     例如 litellm-svc 会定位到 argocd-apps/litellm-svc-app.yaml。
#   - image_tag：应用 CI 构建并推送到 GHCR 后生成的新镜像 tag，通常使用 Git commit SHA。
#
# 【具体修改位置】
#   本 workflow checkout 的就是当前 Repo：
#     nvd11/my-argocd-manifests
#
#   它不会修改应用源码 Repo，也不会修改 GHCR 中已经推送的镜像。
#   目标文件由 svc_name 动态决定：
#     argocd-apps/${svc_name}-app.yaml
#
#   例如：
#     svc_name=litellm-svc
#     -> nvd11/my-argocd-manifests/argocd-apps/litellm-svc-app.yaml
#
#   文件中的 image.tag 字段会从旧值更新为 image_tag；image.repository 不由本 workflow 修改。
#   例如：
#     image:
#       repository: ghcr.io/nvd11/my-litellm-service
#       tag: <old-sha>
#
#   会更新为：
#     image:
#       repository: ghcr.io/nvd11/my-litellm-service
#       tag: <new-sha>
#
# 【后续动作】
#   修改完成后，本 workflow 使用 contents: write 权限执行：
#     git add -> git commit -> git push
#
#   Git commit 推送回 my-argocd-manifests 后，ArgoCD 监控到该 Repo 的清单变化，
#   再根据更新后的 image.repository + image.tag 拉取并部署新镜像。
#
# 【注意】
#   Redis 等使用固定官方镜像 (如 redis:7.2-alpine) 的服务【不需要】本 workflow，
#   它们没有自建镜像要构建，直接改 Manifest push 即可，ArgoCD 会自动轮询部署。
# ============================================================
name: CD Configuration Update

on:
  repository_dispatch:
    types: [update-image-tag]

concurrency:
  group: gitops-cd-update
  cancel-in-progress: false # 💡 false表示排队执行，true表示打断正在运行的前一个任务

permissions:
  contents: write

jobs:
  update-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Update Image Tag in ArgoCD App Manifest
        run: |
          TAG=${{ github.event.client_payload.image_tag }}
          SVC_NAME=${{ github.event.client_payload.svc_name }}
          
          echo "Updating image tag for $SVC_NAME to $TAG"
          
          # 动态拼接要修改的文件路径 (e.g. argocd-apps/quarkus-svc-app.yaml)
          MANIFEST_FILE="argocd-apps/${SVC_NAME}-app.yaml"
          
          # 使用 sed 精准替换 ArgoCD Application 清单中的 tag
          sed -i -E "s/tag: [a-f0-9]+(.*)/tag: ${TAG}\1/g" "$MANIFEST_FILE"
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add "$MANIFEST_FILE"
          git commit -m "ci: auto-update $SVC_NAME image tag to ${TAG} [skip ci]" || echo "No changes to commit"
          git push
